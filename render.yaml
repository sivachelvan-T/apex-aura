services:
  - type: web
    name: apex-aura
    runtime: python
    plan: starter          # free plan cannot attach a persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Flask session-signing key
      - key: FERNET_KEY
        sync: false               # set manually — see README
      - key: DB_PATH
        value: /var/data/apex_aura.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: apex-aura-data
      mountPath: /var/data
      sizeGB: 1
